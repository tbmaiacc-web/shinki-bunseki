<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#ffffff">
<!-- ホーム画面に追加したときに単独アプリとして動かす（iPadOS/iOS） -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="姿勢記録">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>姿勢写真記録</title>
<style>
:root{
  --fg:#111;
  --fg-sub:#555;
  --line:#c9ced6;
  --line-strong:#8d949e;
  --bg:#fff;
  --bg-sub:#f2f4f7;
  --accent:#0b57d0;
  --danger:#b3261e;
  --tap:48px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;
  color:var(--fg);background:var(--bg);
  font-size:17px;line-height:1.5;
  touch-action:manipulation;
  -webkit-text-size-adjust:100%;
  padding-bottom:40px;
}
h1,h2,h3{margin:0;font-weight:700}
h1{font-size:1.25rem}
h2{font-size:1.1rem}
h3{font-size:1rem}
button,input,select,textarea{font:inherit;color:inherit}

/* ---------- レイアウト ---------- */
.wrap{max-width:1200px;margin:0 auto;padding:0 12px}
.bar{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-bottom:2px solid var(--fg);
  position:sticky;top:0;background:var(--bg);z-index:20;
  padding-top:max(10px, env(safe-area-inset-top));
}
.bar .grow{flex:1;min-width:0}
.bar h1,.bar h2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.view{display:block}
.view.hidden{display:none}
.section{padding:12px}
.stack{display:flex;flex-direction:column;gap:10px}

/* ---------- ボタン ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:var(--tap);padding:10px 16px;
  border:2px solid var(--fg);border-radius:10px;
  background:#fff;color:var(--fg);font-weight:700;
  cursor:pointer;text-align:center;line-height:1.25;
}
.btn:active{background:var(--bg-sub)}
.btn.primary{background:var(--fg);color:#fff}
.btn.primary:active{background:#333}
.btn.ghost{border-color:var(--line-strong);font-weight:600}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.sm{min-height:40px;padding:6px 12px;font-size:0.95rem;border-radius:8px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row.tight{gap:6px}

/* ---------- 入力 ---------- */
label.field{display:block;margin-bottom:12px;font-weight:700}
label.field input,label.field textarea,label.field select{
  display:block;width:100%;margin-top:6px;
  min-height:var(--tap);padding:10px 12px;
  border:2px solid var(--line-strong);border-radius:10px;background:#fff;font-weight:400;
}
label.field textarea{min-height:88px;resize:vertical}
.req{font-size:.8rem;color:var(--danger);margin-left:6px}
#q{width:100%;min-height:var(--tap);padding:10px 12px;border:2px solid var(--line-strong);border-radius:10px}

/* ---------- 一覧 ---------- */
.list{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.group{border:2px solid var(--line);border-radius:12px;overflow:hidden}
.grow-head{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:10px;background:#fff;border:0;cursor:pointer;text-align:left;
  min-height:var(--tap);
}
.grow-head:active{background:var(--bg-sub)}
.grow-head .name{font-weight:700;font-size:1.05rem}
.grow-head .sub{color:var(--fg-sub);font-size:.88rem}
.badge{
  display:inline-block;min-width:26px;padding:2px 8px;border-radius:999px;
  background:var(--bg-sub);border:1px solid var(--line);
  font-size:.82rem;font-weight:700;text-align:center;color:var(--fg-sub);
}
.chev{font-size:1.1rem;color:var(--fg-sub);width:1.2em;text-align:center}
.thumbs{display:flex;gap:4px;flex:0 0 auto}
.thumbs img,.thumbs .ph{
  width:46px;height:62px;object-fit:cover;border:1px solid var(--line);
  border-radius:6px;background:var(--bg-sub);display:block;
}
.thumbs .ph{display:flex;align-items:center;justify-content:center;font-size:.65rem;color:var(--fg-sub)}
.children{border-top:2px solid var(--line);background:var(--bg-sub)}
.child{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:8px 10px;background:transparent;border:0;border-top:1px solid var(--line);
  cursor:pointer;text-align:left;min-height:var(--tap);
}
.child:first-child{border-top:0}
.child:active{background:#e4e8ee}
.child .date{font-weight:700;flex:1}
.child .memo1{color:var(--fg-sub);font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:45%}
.empty-msg{padding:28px 12px;text-align:center;color:var(--fg-sub)}

/* ---------- 編集：写真スロット ---------- */
.slots{display:flex;flex-wrap:wrap;gap:14px}
.slot{flex:1 1 320px;min-width:280px;border:2px solid var(--line);border-radius:12px;padding:10px}
.slot-head{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.tilt{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;font-size:.95rem}
.tilt .num{font-size:1.15rem}
.tilt.none{color:var(--fg-sub);font-weight:400}
.canvas-wrap{
  position:relative;background:var(--bg-sub);border:1px solid var(--line);border-radius:8px;
  min-height:140px;display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.canvas-wrap canvas{display:block;max-width:100%;touch-action:none}
.canvas-wrap canvas.hidden{display:none}
.canvas-wrap .placeholder{color:var(--fg-sub);padding:36px 12px;text-align:center;font-size:.9rem}
.line-ctl{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.seg{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg>.lbl{font-size:.88rem;font-weight:700;color:var(--fg-sub);min-width:3em}
.swatch{
  width:var(--tap);height:40px;border:2px solid var(--line-strong);border-radius:8px;
  cursor:pointer;padding:0;position:relative;background:#fff;
}
.swatch i{position:absolute;inset:5px;border-radius:4px;border:1px solid #999}
.swatch.on{border-color:var(--fg);box-shadow:inset 0 0 0 2px #fff}
.wbtn{min-height:40px;padding:4px 14px;border:2px solid var(--line-strong);border-radius:8px;background:#fff;font-weight:700;cursor:pointer}
.wbtn.on{border-color:var(--fg);background:var(--fg);color:#fff}
.seg.chips{gap:6px}
.chip{
  min-height:40px;padding:4px 12px;border:2px solid var(--line-strong);border-radius:999px;
  background:#fff;font-weight:700;font-size:.9rem;cursor:pointer;white-space:nowrap;
}
.chip.on{border-color:var(--fg);background:var(--fg);color:#fff}
.chip.add{border-style:dashed;font-weight:600;color:var(--fg-sub)}
.hint{font-size:.82rem;color:var(--fg-sub);margin:6px 0 0}

/* ---------- 詳細 ---------- */
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;padding:0 12px 6px}
.meta .k{font-size:.82rem;color:var(--fg-sub)}
.pairs{display:flex;gap:14px;flex-wrap:wrap;padding:0 12px}
.rec-col{flex:1 1 320px;min-width:260px;border:2px solid var(--line);border-radius:12px;padding:10px}
.rec-col.current{border-color:var(--fg)}
.rec-col>h3{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.rec-col .tag{font-size:.75rem;padding:2px 8px;border-radius:999px;background:var(--fg);color:#fff}
.rec-col .tag.alt{background:var(--bg-sub);color:var(--fg-sub);border:1px solid var(--line)}
.photos{display:flex;flex-direction:column;gap:12px}
.photo-box h4{margin:0 0 6px;font-size:.95rem;display:flex;align-items:baseline;gap:4px 8px;flex-wrap:wrap}
.photo-box h4 .tilt{font-size:.85rem;margin-left:auto;text-align:right}
.memo-box{margin:14px 12px;padding:10px 12px;border-left:4px solid var(--line-strong);background:var(--bg-sub);white-space:pre-wrap;border-radius:0 8px 8px 0}
@media (orientation:landscape) and (min-width:700px){
  .pairs.single .photos{flex-direction:row}
  .pairs.single .photo-box{flex:1 1 0;min-width:0}
}

/* ---------- 通知 ---------- */
.notice{
  margin:10px 12px;padding:10px 12px;border:2px solid var(--danger);
  border-radius:10px;background:#fdecea;font-size:.92rem;
}
.notice.warn{border-color:#9a6700;background:#fff8e1}
.notice.hidden{display:none}
#toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
  background:#111;color:#fff;padding:12px 18px;border-radius:10px;font-weight:700;
  opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:100;
  max-width:90vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.tools{margin:26px 12px 0;padding-top:14px;border-top:1px solid var(--line)}
.tools h3{font-size:.95rem;color:var(--fg-sub);margin-bottom:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- 印刷の選択パネル ---------- */
.print-panel{margin:12px;padding:12px;border:2px solid var(--fg);border-radius:12px}
.print-panel .pp-t{font-weight:700;margin-bottom:4px}
.print-panel .pp-s{font-size:.85rem;color:var(--fg-sub);margin-bottom:10px}
.print-panel .pp-btn{
  display:flex;flex-direction:column;align-items:flex-start;gap:2px;
  width:100%;margin-bottom:8px;text-align:left;padding:12px 14px;
}
.print-panel .pp-btn small{font-weight:400;font-size:.82rem;color:var(--fg-sub)}
.print-panel .pp-btn.primary small{color:#ddd}

/* ---------- アプリ内カメラ ---------- */
#v-cam{
  position:fixed;inset:0;z-index:60;background:#000;color:#fff;
  display:flex;flex-direction:column;
}
#v-cam.hidden{display:none}
.cam-stage{position:relative;flex:1;min-height:0;overflow:hidden}
#camVideo{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.cam-overlay{position:absolute;pointer-events:none}
.cam-overlay svg{width:100%;height:100%;display:block}
.cam-bar{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;
  padding:12px 14px;padding-bottom:max(12px, env(safe-area-inset-bottom));
  background:#000;
}
.cam-bar .cam-left{justify-self:start}
.cam-bar .cam-right{justify-self:end;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.cam-bar .shutter{justify-self:center}
.cam-bar .btn{background:transparent;color:#fff;border-color:#fff;white-space:nowrap;padding:6px 10px}
.cam-bar .btn:active{background:#333}
.shutter{
  width:74px;height:74px;border-radius:50%;border:5px solid #fff;background:#fff;
  cursor:pointer;flex:0 0 auto;box-shadow:0 0 0 4px rgba(255,255,255,.25);
}
.shutter:active{background:#bbb}
.cam-note{grid-column:1/-1;text-align:center;font-size:.8rem;color:#bbb;margin-top:2px;white-space:nowrap}

/* ---------- 印刷 ---------- */
#printArea{display:none}
@media print{
  body{padding:0;background:#fff}
  .view,#toast,.notice,#v-cam{display:none !important}
  #printArea{display:block}
  @page{size:A4 portrait;margin:12mm}
  .p-page{page-break-after:always;break-after:page}
  .p-page:last-child{page-break-after:auto;break-after:auto}
  .p-head{
    display:flex;justify-content:space-between;align-items:baseline;gap:8mm;
    border-bottom:1.2pt solid #000;padding-bottom:2.5mm;margin-bottom:4mm;
  }
  .p-name{font-size:15pt;font-weight:700}
  .p-sub{font-size:10pt}
  .p-row{display:flex;gap:6mm;justify-content:center;align-items:flex-start}
  .p-row+.p-row{margin-top:5mm}
  .p-cell{flex:1 1 0;min-width:0;text-align:center}
  .p-cell img{display:block;margin:0 auto;max-width:100%;width:auto;height:auto}
  .p-img-xl img{max-height:222mm}
  .p-img-lg img{max-height:186mm}
  .p-img-md img{max-height:128mm}
  .p-img-sm img{max-height:100mm}
  .p-cap{font-size:9.5pt;margin-top:1.5mm;line-height:1.3}
  .p-cap b{font-size:10.5pt}
  .p-memo{margin-top:5mm;font-size:9.5pt;white-space:pre-wrap;border-left:2pt solid #999;padding-left:3mm}
  .p-foot{margin-top:4mm;font-size:8.5pt;color:#555;text-align:right}
}
</style>
</head>
<body>

<div id="toast" role="status" aria-live="polite"></div>

<!-- ======================= 一覧 ======================= -->
<section id="v-list" class="view">
  <div class="bar">
    <h1 class="grow">姿勢写真記録</h1>
    <button id="btnNew" class="btn primary">＋ 新規</button>
  </div>
  <div id="dbNotice" class="notice hidden"></div>
  <div id="quotaNotice" class="notice warn hidden"></div>
  <div class="section">
    <label class="sr" for="q">氏名で検索</label>
    <input id="q" type="search" placeholder="氏名で検索" autocomplete="off" enterkeyhint="search">
  </div>
  <div id="list" class="list section" style="padding-top:0"></div>
  <div class="tools">
    <h3>バックアップ・端末移行</h3>
    <div class="row">
      <button id="btnExport" class="btn sm">全データを書き出し（JSON）</button>
      <button id="btnImport" class="btn sm">JSONを読み込み</button>
      <input id="impFile" type="file" accept="application/json,.json" hidden>
    </div>
    <p class="hint">データはこの端末のブラウザ内（IndexedDB）にのみ保存されます。外部へ送信されません。端末やブラウザを変える前に必ず書き出してください。</p>
  </div>
</section>

<!-- ======================= 編集 ======================= -->
<section id="v-edit" class="view hidden">
  <div class="bar">
    <button id="eBack" class="btn ghost sm">← 戻る</button>
    <h2 id="eTitle" class="grow">新規記録</h2>
    <button id="eSave" class="btn primary">保存</button>
  </div>
  <div class="section">
    <label class="field">氏名<span class="req">必須</span>
      <input id="fName" type="text" autocomplete="off" enterkeyhint="done">
    </label>
    <label class="field">撮影日
      <input id="fDate" type="date">
    </label>
    <label class="field">メモ
      <textarea id="fMemo" rows="3" placeholder="任意"></textarea>
    </label>
  </div>
  <div id="slots" class="slots section" style="padding-top:0"></div>
  <div class="section">
    <button id="eSave2" class="btn primary wide">保存</button>
  </div>
</section>

<!-- ======================= 詳細 ======================= -->
<section id="v-detail" class="view hidden">
  <div class="bar">
    <button id="dBack" class="btn ghost sm">← 一覧</button>
    <h2 id="dTitle" class="grow"></h2>
  </div>
  <div id="dMeta" class="meta"></div>
  <div id="dCmpWrap" class="section" style="padding-top:0">
    <label class="field" style="margin:0">過去の記録と比較
      <select id="dCmp"></select>
    </label>
  </div>
  <div id="dPairs" class="pairs"></div>
  <div id="dMemo" class="memo-box" hidden></div>
  <div id="printPanel" class="print-panel" hidden>
    <div class="pp-t">印刷のしかたを選んでください</div>
    <div class="pp-s" id="ppSub"></div>
    <button class="btn primary pp-btn" data-layout="duplex">両面用（2ページ）
      <small>1ページ目に正面、2ページ目に側面。プリンタを両面設定にすると1枚の表裏になります</small></button>
    <button class="btn pp-btn" data-layout="single">1ページに2枚
      <small>正面と側面を横並びで1枚に収めます</small></button>
    <button class="btn ghost" data-act="close" style="width:100%">キャンセル</button>
  </div>
  <div class="section row">
    <button id="dPrint" class="btn">印刷</button>
    <button id="dEdit" class="btn">編集</button>
    <button id="dDel" class="btn danger">削除</button>
  </div>
</section>

<!-- ======================= アプリ内カメラ ======================= -->
<section id="v-cam" class="hidden" aria-hidden="true">
  <div class="cam-stage" id="camStage">
    <video id="camVideo" playsinline autoplay muted></video>
    <div id="camOverlay" class="cam-overlay"></div>
  </div>
  <div class="cam-bar">
    <button id="camCancel" class="btn sm cam-left">キャンセル</button>
    <button id="camShot" class="shutter" aria-label="撮影"></button>
    <div class="cam-right">
      <button id="camGuide" class="btn sm">ガイド：中央線</button>
      <button id="camSwitch" class="btn sm">カメラ切替</button>
    </div>
    <div class="cam-note" id="camNote">ガイド線は写真には写りません</div>
  </div>
</section>

<div id="printArea" aria-hidden="true"></div>

<noscript><p class="section">このアプリはJavaScriptが必要です。</p></noscript>

<script>
'use strict';
/* =========================================================
   定数
   ========================================================= */
var COLORS   = {red:'#ff2a2a', yellow:'#ffd400', white:'#ffffff'};
var SLOT_KEYS = ['front','side'];
var SLOT_LABEL = {front:'正面', side:'側面'};
var HANDLE_R = 22;            // ハンドル半径(CSS px) → 当たり判定44px四方以上
var MAX_EDGE = 1600;          // 長辺
var JPEG_Q   = 0.8;
var THUMB_EDGE = 240;

/* =========================================================
   小物
   ========================================================= */
function $(id){ return document.getElementById(id); }
function el(tag, cls, text){
  var e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text != null) e.textContent = text;
  return e;
}
function todayStr(){
  var d = new Date();
  var m = String(d.getMonth()+1).padStart(2,'0');
  var dd = String(d.getDate()).padStart(2,'0');
  return d.getFullYear()+'-'+m+'-'+dd;
}
function fmtDate(s){
  if(!s) return '';
  var p = s.split('-');
  if(p.length !== 3) return s;
  return p[0]+'年'+Number(p[1])+'月'+Number(p[2])+'日';
}
function norm(s){
  s = String(s==null?'':s);
  try { s = s.normalize('NFKC'); } catch(e){}
  return s.toLowerCase().replace(/\s+/g,'');
}
function safeName(s){
  return String(s||'無名').replace(/[\\/:*?"<>|\u0000-\u001f]/g,'_').trim() || '無名';
}
function uid(){
  if(self.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);
}
var toastTimer = null;
function toast(msg){
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}
function download(blob, filename){
  var u = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = u; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(u); }, 8000);
}

/* =========================================================
   IndexedDB
   ========================================================= */
var DB_NAME='postureRecordDB', DB_VER=1, STORE='records';
var dbPromise = null, dbBroken = false;

function openDB(){
  return new Promise(function(res, rej){
    if(!self.indexedDB){ rej(new Error('IndexedDB非対応')); return; }
    var req;
    try { req = indexedDB.open(DB_NAME, DB_VER); }
    catch(e){ rej(e); return; }
    req.onupgradeneeded = function(){
      var db = req.result;
      if(!db.objectStoreNames.contains(STORE)){
        var s = db.createObjectStore(STORE, {keyPath:'id'});
        s.createIndex('name','name');
        s.createIndex('date','date');
      }
    };
    req.onsuccess = function(){ res(req.result); };
    req.onerror   = function(){ rej(req.error || new Error('DBを開けません')); };
    req.onblocked = function(){ rej(new Error('DBがブロックされました（他のタブを閉じてください）')); };
  });
}
function db(){
  if(!dbPromise) dbPromise = openDB();
  return dbPromise;
}
function store(mode){
  return db().then(function(d){
    return d.transaction(STORE, mode).objectStore(STORE);
  });
}
function reqP(r){
  return new Promise(function(res, rej){
    r.onsuccess = function(){ res(r.result); };
    r.onerror   = function(){ rej(r.error); };
  });
}
function dbAll(){ return store('readonly').then(function(s){ return reqP(s.getAll()); }); }
function dbPut(rec){ return store('readwrite').then(function(s){ return reqP(s.put(rec)); }); }
function dbDel(id){ return store('readwrite').then(function(s){ return reqP(s.delete(id)); }); }

/* =========================================================
   画像処理
   ========================================================= */
function decodeBlob(blob){
  if(self.createImageBitmap){
    return createImageBitmap(blob, {imageOrientation:'from-image'})
      .catch(function(){ return createImageBitmap(blob); })
      .catch(function(){ return decodeViaImg(blob); });
  }
  return decodeViaImg(blob);
}
function decodeViaImg(blob){
  return new Promise(function(res, rej){
    var img = new Image();
    var u = URL.createObjectURL(blob);
    img.onload = function(){ res(img); };
    img.onerror = function(){ URL.revokeObjectURL(u); rej(new Error('画像を読み込めませんでした')); };
    img.src = u;
  });
}
function srcW(s){ return s.width || s.naturalWidth; }
function srcH(s){ return s.height || s.naturalHeight; }

function toBlobP(canvas, type, q){
  return new Promise(function(res, rej){
    if(canvas.toBlob){
      canvas.toBlob(function(b){ b ? res(b) : rej(new Error('書き出しに失敗しました')); }, type, q);
    } else {
      try { res(dataURLtoBlob(canvas.toDataURL(type, q))); }
      catch(e){ rej(e); }
    }
  });
}
// 長辺 maxEdge に縮小した JPEG を返す
function shrink(src, maxEdge, quality){
  var w = srcW(src), h = srcH(src);
  var sc = Math.min(1, maxEdge/Math.max(w,h));
  var cw = Math.max(1, Math.round(w*sc)), ch = Math.max(1, Math.round(h*sc));
  var c = document.createElement('canvas');
  c.width = cw; c.height = ch;
  var ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,cw,ch);
  ctx.drawImage(src, 0, 0, cw, ch);
  return toBlobP(c, 'image/jpeg', quality).then(function(blob){
    return {blob:blob, w:cw, h:ch, canvas:c};
  });
}
// ファイル → 写真データ（線は初期値）
function fileToPhoto(file){
  return decodeBlob(file).then(function(src){
    return shrink(src, MAX_EDGE, JPEG_Q).then(function(main){
      var photo = {
        blob: main.blob, w: main.w, h: main.h,
        lines: [defaultLine(main.w, main.h)], thumb: null
      };
      return makeThumb(src, photo).then(function(t){
        photo.thumb = t;
        return {photo:photo, img:src};
      });
    });
  });
}
// 線を焼き込んだサムネイル
function makeThumb(src, photo){
  var w = photo.w, h = photo.h;
  var sc = Math.min(1, THUMB_EDGE/Math.max(w,h));
  var cw = Math.max(1, Math.round(w*sc)), ch = Math.max(1, Math.round(h*sc));
  var c = document.createElement('canvas');
  c.width = cw; c.height = ch;
  var ctx = c.getContext('2d');
  ctx.drawImage(src, 0, 0, cw, ch);
  drawLines(ctx, photo, cw/w, 1, -1);
  return toBlobP(c, 'image/jpeg', 0.7);
}

/* =========================================================
   線
   ========================================================= */
var MAX_LINES = 4;
function defaultLine(w, h){            // 垂直線（中央）
  return {x1:w/2, y1:h*0.04, x2:w/2, y2:h*0.96, color:'red', width:1};
}
function defaultHLine(w, h){           // 水平線（中央）
  return {x1:w*0.04, y1:h/2, x2:w*0.96, y2:h/2, color:'yellow', width:1};
}
// 旧形式（line 1本）も読めるようにする
function linesOf(photo){
  if(!photo) return [];
  if(!photo.lines){
    photo.lines = photo.line ? [photo.line] : [];
    delete photo.line;
  }
  return photo.lines;
}
function strokePx(level, w, h){
  var base = Math.min(w, h);
  return Math.max(2, Math.round(base * (level === 2 ? 0.009 : 0.0045)));
}
// 無限直線を画像矩形の端まで延長した2点を返す
function extendLine(l, w, h){
  var dx = l.x2 - l.x1, dy = l.y2 - l.y1;
  if(dx === 0 && dy === 0) return [{x:l.x1,y:l.y1},{x:l.x2,y:l.y2}];
  var tmin = -1e9, tmax = 1e9, bad = false;
  function slab(p, d, lo, hi){
    if(Math.abs(d) < 1e-9){ if(p < lo || p > hi) bad = true; return; }
    var t1 = (lo-p)/d, t2 = (hi-p)/d;
    if(t1 > t2){ var t = t1; t1 = t2; t2 = t; }
    if(t1 > tmin) tmin = t1;
    if(t2 < tmax) tmax = t2;
  }
  slab(l.x1, dx, 0, w);
  slab(l.y1, dy, 0, h);
  if(bad || tmax < tmin) return [{x:l.x1,y:l.y1},{x:l.x2,y:l.y2}];
  return [
    {x:l.x1+dx*tmin, y:l.y1+dy*tmin},
    {x:l.x1+dx*tmax, y:l.y1+dy*tmax}
  ];
}
// 垂直からの傾き（度）。正 = 上端が右に倒れている
function tiltDeg(l){
  var dx = l.x2 - l.x1, dy = l.y2 - l.y1;
  if(dy < 0){ dx = -dx; dy = -dy; }   // 常に「上→下」の向きに揃える
  if(dx === 0 && dy === 0) return 0;
  return -Math.atan2(dx, dy) * 180 / Math.PI;
}
function tiltText(l){
  if(!l) return '—';
  var d = tiltDeg(l);
  var a = Math.abs(d);
  if(a < 0.05) return '0.0°（垂直）';
  return a.toFixed(1) + '°（上が' + (d > 0 ? '右' : '左') + '）';
}
// 縦寄りの線は垂直基準、横寄りの線は水平基準で読む
function isHorizontal(l){ return Math.abs(tiltDeg(l)) > 45; }
function lineText(l){
  if(!l) return '—';
  if(!isHorizontal(l)) return '垂直との差 ' + tiltText(l);
  var dx = l.x2 - l.x1, dy = l.y2 - l.y1;
  if(dx < 0){ dx = -dx; dy = -dy; }
  var h = Math.atan2(dy, dx) * 180 / Math.PI;    // 正 = 右端が下がる
  var a = Math.abs(h);
  if(a < 0.05) return '水平との差 0.0°（水平）';
  return '水平との差 ' + a.toFixed(1) + '°（右が' + (h > 0 ? '下がる' : '上がる') + '）';
}
function lineLabel(l, i){ return '線' + (i+1) + (isHorizontal(l) ? '（横）' : '（縦）'); }
function linesText(photo){
  var ls = linesOf(photo);
  if(!ls.length) return '線なし';
  return ls.map(function(l){ return lineText(l); }).join(' ／ ');
}

/* =========================================================
   キャンバス描画
   ========================================================= */
var renderTasks = [];   // 画面回転・リサイズ時に再描画する対象

function fitCanvas(canvas, natW, natH){
  var wrap = canvas.parentElement;
  var avail = wrap.clientWidth - 2;
  var cssW = Math.max(60, avail);
  var maxH = Math.max(220, Math.round(window.innerHeight * 0.62));
  var cssH = cssW * natH / natW;
  if(cssH > maxH){ cssH = maxH; cssW = cssH * natW / natH; }
  var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  canvas.style.width  = Math.round(cssW)+'px';
  canvas.style.height = Math.round(cssH)+'px';
  canvas.width  = Math.max(1, Math.round(cssW*dpr));
  canvas.height = Math.max(1, Math.round(cssH*dpr));
  return {scale: canvas.width/natW, dpr: canvas.width/cssW};
}
function drawLine(ctx, line, natW, natH, scale, handles, dpr){
  var pts = extendLine(line, natW, natH);
  var a = pts[0], b = pts[1];
  ctx.save();
  ctx.lineCap = 'butt';
  var wpx = Math.max(1, strokePx(line.width, natW, natH) * scale);
  // 白い写真でも見えるよう薄い縁取りを入れる
  ctx.strokeStyle = 'rgba(0,0,0,0.45)';
  ctx.lineWidth = wpx + 2*dpr;
  ctx.beginPath(); ctx.moveTo(a.x*scale, a.y*scale); ctx.lineTo(b.x*scale, b.y*scale); ctx.stroke();
  ctx.strokeStyle = COLORS[line.color] || COLORS.red;
  ctx.lineWidth = wpx;
  ctx.beginPath(); ctx.moveTo(a.x*scale, a.y*scale); ctx.lineTo(b.x*scale, b.y*scale); ctx.stroke();
  if(handles){
    var ends = [{x:line.x1,y:line.y1},{x:line.x2,y:line.y2}];
    for(var i=0;i<ends.length;i++){
      var p = ends[i], r = HANDLE_R*dpr;
      ctx.beginPath(); ctx.arc(p.x*scale, p.y*scale, r, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,255,255,0.80)'; ctx.fill();
      ctx.lineWidth = 2.5*dpr; ctx.strokeStyle = '#111'; ctx.stroke();
      ctx.beginPath(); ctx.arc(p.x*scale, p.y*scale, 3.5*dpr, 0, Math.PI*2);
      ctx.fillStyle = '#111'; ctx.fill();
    }
  }
  ctx.restore();
}
// sel: ハンドルを表示する線の番号（表示専用なら -1）
function drawPhoto(canvas, img, photo, sel){
  var g = fitCanvas(canvas, photo.w, photo.h);
  var ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  drawLines(ctx, photo, g.scale, g.dpr, sel);
  return g;
}
function drawLines(ctx, photo, scale, dpr, sel){
  var ls = linesOf(photo);
  for(var i=0;i<ls.length;i++){
    drawLine(ctx, ls[i], photo.w, photo.h, scale, i === sel, dpr);
  }
}
function addRenderTask(canvas, img, photo, handles){
  renderTasks.push({canvas:canvas, img:img, photo:photo, handles:handles});
}
var resizeTimer = null;
function onResize(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function(){
    for(var i=0;i<renderTasks.length;i++){
      var t = renderTasks[i];
      if(!t.canvas.isConnected) continue;
      drawPhoto(t.canvas, t.img, t.photo, t.handles);
    }
  }, 120);
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', onResize);

/* =========================================================
   状態・画面遷移
   ========================================================= */
var records = [];          // 全記録（画像Blob込み）
var expanded = {};         // 氏名 → 展開中
var thumbURLs = [];        // 一覧のobjectURL
var edit = null;           // 編集中の状態
var detailId = null;
var compareId = '';

function showView(name){
  ['list','edit','detail'].forEach(function(v){
    $('v-'+v).classList.toggle('hidden', v !== name);
  });
  var pp = $('printPanel');
  if(pp) pp.hidden = true;
  window.scrollTo(0,0);
}
function clearThumbs(){
  thumbURLs.forEach(function(u){ URL.revokeObjectURL(u); });
  thumbURLs = [];
}

/* =========================================================
   一覧画面
   ========================================================= */
function groupRecords(){
  var q = norm($('q').value);
  var map = {};
  records.forEach(function(r){
    if(q && norm(r.name).indexOf(q) < 0) return;
    (map[r.name] = map[r.name] || []).push(r);
  });
  var groups = Object.keys(map).map(function(name){
    var list = map[name].slice().sort(function(a,b){
      if(a.date !== b.date) return a.date < b.date ? 1 : -1;
      return (b.createdAt||0) - (a.createdAt||0);
    });
    return {name:name, list:list, latest:list[0].date};
  });
  groups.sort(function(a,b){
    if(a.latest !== b.latest) return a.latest < b.latest ? 1 : -1;
    return a.name.localeCompare(b.name, 'ja');
  });
  return groups;
}
function thumbEls(rec){
  var box = el('div','thumbs');
  SLOT_KEYS.forEach(function(k){
    var p = rec[k];
    if(p && (p.thumb || p.blob)){
      var img = el('img');
      var u = URL.createObjectURL(p.thumb || p.blob);
      thumbURLs.push(u);
      img.src = u; img.alt = SLOT_LABEL[k]; img.loading = 'lazy';
      box.appendChild(img);
    } else {
      box.appendChild(el('div','ph', SLOT_LABEL[k]));
    }
  });
  return box;
}
function renderList(){
  clearThumbs();
  var host = $('list');
  host.textContent = '';
  var groups = groupRecords();
  if(!groups.length){
    host.appendChild(el('p','empty-msg',
      records.length ? '一致する記録がありません。' : '記録がありません。「＋ 新規」から登録してください。'));
    return;
  }
  groups.forEach(function(g){
    var wrap = el('div','group');
    var head = el('button','grow-head');
    head.type = 'button';
    var isOpen = !!expanded[g.name];

    head.appendChild(el('span','chev', g.list.length > 1 ? (isOpen ? '▾' : '▸') : '›'));
    var txt = el('div','grow grow-txt');
    txt.appendChild(el('div','name', g.name));
    txt.appendChild(el('div','sub', fmtDate(g.latest) + (g.list.length>1 ? '（最新）' : '')));
    head.appendChild(txt);
    head.appendChild(el('span','badge', String(g.list.length)));
    head.appendChild(thumbEls(g.list[0]));
    head.addEventListener('click', function(){
      if(g.list.length === 1){ openDetail(g.list[0].id); return; }
      expanded[g.name] = !expanded[g.name];
      renderList();
    });
    wrap.appendChild(head);

    if(isOpen && g.list.length > 1){
      var kids = el('div','children');
      g.list.forEach(function(r){
        var c = el('button','child');
        c.type = 'button';
        c.appendChild(el('span','date', fmtDate(r.date)));
        if(r.memo) c.appendChild(el('span','memo1', r.memo.replace(/\s+/g,' ')));
        c.appendChild(thumbEls(r));
        c.appendChild(el('span','chev','›'));
        c.addEventListener('click', function(){ openDetail(r.id); });
        kids.appendChild(c);
      });
      wrap.appendChild(kids);
    }
    host.appendChild(wrap);
  });
}

/* =========================================================
   編集画面
   ========================================================= */
function openEdit(rec){
  edit = {
    id: rec ? rec.id : null,
    createdAt: rec ? rec.createdAt : Date.now(),
    slots: {front:null, side:null}
  };
  $('eTitle').textContent = rec ? '記録を編集' : '新規記録';
  $('fName').value = rec ? rec.name : '';
  $('fDate').value = rec ? rec.date : todayStr();
  $('fMemo').value = rec ? (rec.memo || '') : '';
  renderTasks = [];
  buildSlots();
  showView('edit');

  if(rec){
    SLOT_KEYS.forEach(function(k){
      var p = rec[k];
      if(!p) return;
      decodeBlob(p.blob).then(function(img){
        edit.slots[k] = {
          photo: {blob:p.blob, w:p.w, h:p.h, thumb:p.thumb,
                  lines: linesOf(p).map(function(l){ return Object.assign({}, l); })},
          img: img, sel: null
        };
        renderSlot(k);
      }).catch(function(e){ toast(SLOT_LABEL[k]+'の画像を読めませんでした'); });
    });
  }
}
function buildSlots(){

      '</div>'+
      '<div class="row tight" style="margin-top:10px">'+
        '<label class="btn sm" style="flex:1 1 46%">'+
          '<span data-el="camLabel">カメラで撮影</span>'+
          '<input type="file" accept="image/*" capture="environment" hidden data-el="cam">'+
        '</label>'+
        '<label class="btn sm" style="flex:1 1 46%">'+
          '<span data-el="pickLabel">画像を選択</span>'+
          '<input type="file" accept="image/*" hidden data-el="pick">'+
        '</label>'+
        '<button type="button" class="btn sm danger" data-el="clear" hidden>写真を削除</button>'+
      '</div>'+
      '<div class="line-ctl" data-el="ctl" hidden>'+
        '<div class="seg chips" data-el="chips"></div>'+
        '<div class="seg" data-el="sel1"><span class="lbl">色</span>'+
          '<button type="button" class="swatch" data-color="red"><i style="background:'+COLORS.red+'"></i></button>'+
          '<button type="button" class="swatch" data-color="yellow"><i style="background:'+COLORS.yellow+'"></i></button>'+
          '<button type="button" class="swatch" data-color="white"><i style="background:'+COLORS.white+'"></i></button>'+
          '<span class="lbl" style="margin-left:8px">太さ</span>'+
          '<button type="button" class="wbtn" data-w="1">細</button>'+
          '<button type="button" class="wbtn" data-w="2">太</button>'+
        '</div>'+
        '<div class="seg" data-el="sel2">'+
          '<button type="button" class="btn sm" data-el="reset">位置を戻す</button>'+
          '<button type="button" class="btn sm danger" data-el="delline">この線を消す</button>'+
        '</div>'+
        '<p class="hint">両端の丸いハンドルで位置と角度を調整できます。線の上をドラッグすると線全体が動きます。線が複数あるときは、動かしたい線をタップしてから操作してください。</p>'+
      '</div>';
    host.appendChild(slot);

    var q = function(n){ return slot.querySelector('[data-el="'+n+'"]'); };
    q('cam').addEventListener('change', function(e){ onPick(k, e.target); });
    q('pick').addEventListener('change', function(e){ onPick(k, e.target); });
    // ガイド付きのアプリ内カメラを使う（使えない端末は端末標準のカメラへ）
    q('camLabel').parentElement.addEventListener('click', function(e){
      if(CAM_OK){ e.preventDefault(); openCam(k); }
    });
    q('clear').addEventListener('click', function(){
      if(!confirm(SLOT_LABEL[k]+'の写真を削除します。よろしいですか？')) return;
      edit.slots[k] = null; renderSlot(k);
    });
    q('reset').addEventListener('click', function(){
      var l = selLine(k); if(!l) return;
      var s = edit.slots[k];
      var def = isHorizontal(l) ? defaultHLine(s.photo.w, s.photo.h) : defaultLine(s.photo.w, s.photo.h);
      def.color = l.color; def.width = l.width;
      s.photo.lines[s.sel] = def;
      renderSlot(k);
    });

      var s = edit.slots[k]; if(!s) return;
      var ls = linesOf(s.photo);

      s.sel = Math.min(s.sel, ls.length-1);
      renderSlot(k);
    });

      var b = e.target.closest ? e.target.closest('button') : null;
      if(!b) return;

      var ls = linesOf(s.photo);
      if(b.dataset.add){
        if(ls.length >= MAX_LINES){ toast('線は'+MAX_LINES+'本までです'); return; }
        ls.push(b.dataset.add === 'h' ? defaultHLine(s.photo.w, s.photo.h)
                                      : defaultLine(s.photo.w, s.photo.h));
        s.sel = ls.length - 1;
      } else if(b.dataset.i != null){
        s.sel = Number(b.dataset.i);
      }

    });
    attachDrag(k, q('cv'));
  });

function onPick(k, input){
  var file = input.files && input.files[0];
  input.value = '';
  if(!file) return;
  applyPhoto(k, file);
}
function applyPhoto(k, file){
  toast('画像を処理中…');
  return fileToPhoto(file).then(function(r){
    var prev = edit.slots[k];
    var pl = prev && prev.photo ? linesOf(prev.photo)[0] : null;
    if(pl && r.photo.lines[0]){            // 色と太さは前の設定を引き継ぐ
      r.photo.lines[0].color = pl.color;
      r.photo.lines[0].width = pl.width;
    }
    r.sel = null;
    edit.slots[k] = r;
    renderSlot(k);
    toast(SLOT_LABEL[k]+'を取り込みました');
  }).catch(function(e){
    alert('画像を取り込めませんでした：' + (e && e.message ? e.message : e));

}
function renderSlot(k){
  var slot = $('slots').querySelector('.slot[data-k="'+k+'"]');
  if(!slot) return;
  var q = function(n){ return slot.querySelector('[data-el="'+n+'"]'); };
  var s = edit.slots[k];
  var cv = q('cv');
  renderTasks = renderTasks.filter(function(t){ return t.canvas !== cv; });

  if(!s){
    cv.classList.add('hidden');
    q('ph').hidden = false;
    q('ctl').hidden = true;
    q('clear').hidden = true;
    q('camLabel').textContent = 'カメラで撮影';

    var t0 = q('tilt'); t0.className = 'tilt none'; t0.textContent = '写真なし';
    return;
  }
  cv.classList.remove('hidden');
  q('ph').hidden = true;
  q('ctl').hidden = false;
  q('clear').hidden = false;
  q('camLabel').textContent = '撮り直す';
  q('pickLabel').textContent = '別の画像を選択';

  var ls = linesOf(s.photo);
  if(s.sel == null || s.sel >= ls.length) s.sel = ls.length - 1;

  // 線の選択チップ＋追加ボタン
  var chips = q('chips');
  chips.textContent = '';
  ls.forEach(function(l, i){

  });
  if(ls.length < MAX_LINES){
    var av = el('button','chip add','＋ 縦線'); av.type='button'; av.dataset.add='v';
    var ah = el('button','chip add','＋ 横線'); ah.type='button'; ah.dataset.add='h';
    chips.appendChild(av); chips.appendChild(ah);
  }

  var line = ls[s.sel] || null;
  q('sel1').hidden = !line;
  q('sel2').hidden = !line;
  slot.querySelectorAll('.swatch').forEach(function(b){
    b.classList.toggle('on', !!line && b.dataset.color === line.color);

  slot.querySelectorAll('.wbtn').forEach(function(b){
    b.classList.toggle('on', !!line && Number(b.dataset.w) === line.width);
  });
  var t = q('tilt');
  if(!ls.length){
    t.className = 'tilt none';
    t.textContent = '線なし（「＋ 縦線」で追加）';
  } else {
    t.className = 'tilt';
    t.innerHTML = '<span class="num">' + lineText(line) + '</span>';
  }

  drawPhoto(cv, s.img, s.photo, s.sel);
  addRenderTask(cv, s.img, s.photo, s.sel);
}
function selLine(k){
  var s = edit.slots[k];
  if(!s) return null;
  var ls = linesOf(s.photo);
  return ls[s.sel] || null;
}
// ハンドル／線のドラッグ
function attachDrag(k, canvas){
  var drag = null;
  function toNat(e){
    var r = canvas.getBoundingClientRect();
    var s = edit.slots[k];
    return {
      x: (e.clientX - r.left) * s.photo.w / r.width,
      y: (e.clientY - r.top)  * s.photo.h / r.height,
      pxPerNat: r.width / s.photo.w
    };
  }
  function down(e){
    var s = edit.slots[k];
    if(!s) return;
    var ls = linesOf(s.photo);
    if(!ls.length) return;
    var p = toNat(e);
    var tol = HANDLE_R / p.pxPerNat;                  // 44px四方の当たり判定
    var bodyTol = Math.max(tol*0.5, 14/p.pxPerNat);
    var hit = null;

    // 選択中の線 → 他の線 の順に、ハンドルを優先して判定する
    var order = [s.sel];
    for(var i=0;i<ls.length;i++) if(i !== s.sel) order.push(i);
    for(var oi=0; oi<order.length && !hit; oi++){
      var idx = order[oi], l = ls[idx];
      if(!l) continue;
      var d1 = Math.hypot(p.x-l.x1, p.y-l.y1);
      var d2 = Math.hypot(p.x-l.x2, p.y-l.y2);
      if(d1 <= tol && d1 <= d2)  hit = {mode:'p1', idx:idx};
      else if(d2 <= tol)         hit = {mode:'p2', idx:idx};
    }
    for(var oj=0; oj<order.length && !hit; oj++){
      var j = order[oj];
      if(ls[j] && distToSeg(p, ls[j]) <= bodyTol){
        hit = {mode:'move', idx:j, ox:p.x, oy:p.y, l:Object.assign({}, ls[j])};
      }
    }
    if(!hit) return;
    if(hit.idx !== s.sel){ s.sel = hit.idx; renderSlot(k); }
    drag = hit;
    e.preventDefault();
    if(canvas.setPointerCapture) { try{ canvas.setPointerCapture(e.pointerId); }catch(err){} }
    move(e);
  }
  function move(e){
    if(!drag) return;
    var s = edit.slots[k];
    var p = toNat(e);
    var l = linesOf(s.photo)[drag.idx];
    if(!l) return;
    var W = s.photo.w, H = s.photo.h;
    var cl = function(v, max){ return Math.max(0, Math.min(max, v)); };
    if(drag.mode === 'p1'){ l.x1 = cl(p.x, W); l.y1 = cl(p.y, H); }
    else if(drag.mode === 'p2'){ l.x2 = cl(p.x, W); l.y2 = cl(p.y, H); }
    else {
      var dx = p.x - drag.ox, dy = p.y - drag.oy;
      var o = drag.l;
      dx = Math.max(-Math.min(o.x1,o.x2), Math.min(W-Math.max(o.x1,o.x2), dx));
      dy = Math.max(-Math.min(o.y1,o.y2), Math.min(H-Math.max(o.y1,o.y2), dy));
      l.x1 = o.x1+dx; l.y1 = o.y1+dy; l.x2 = o.x2+dx; l.y2 = o.y2+dy;
    }
    e.preventDefault();
    var slot = canvas.closest('.slot');
    var t = slot.querySelector('[data-el="tilt"]');
    t.className = 'tilt';
    t.innerHTML = '<span class="num">'+ lineText(l) +'</span>';
    drawPhoto(canvas, s.img, s.photo, s.sel);
  }
  function up(){ drag = null; }
  if(window.PointerEvent){
    canvas.addEventListener('pointerdown', down);
    canvas.addEventListener('pointermove', move);
    canvas.addEventListener('pointerup', up);
    canvas.addEventListener('pointercancel', up);
  } else {
    var wrapT = function(h){ return function(ev){
      if(!ev.touches || !ev.touches.length){ h(ev); return; }
      var t = ev.touches[0];
      h({clientX:t.clientX, clientY:t.clientY, preventDefault:function(){ ev.preventDefault(); }});
    };};
    canvas.addEventListener('touchstart', wrapT(down), {passive:false});
    canvas.addEventListener('touchmove', wrapT(move), {passive:false});
    canvas.addEventListener('touchend', up);
    canvas.addEventListener('mousedown', down);
    canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  }
}
function distToSeg(p, l){
  var vx = l.x2-l.x1, vy = l.y2-l.y1;
  var len2 = vx*vx + vy*vy;
  if(len2 === 0) return Math.hypot(p.x-l.x1, p.y-l.y1);
  var t = Math.max(0, Math.min(1, ((p.x-l.x1)*vx + (p.y-l.y1)*vy) / len2));
  return Math.hypot(p.x - (l.x1+t*vx), p.y - (l.y1+t*vy));
}

function saveEdit(){

    id: edit.id || uid(),
    name: name, date: date, memo: $('fMemo').value,
    createdAt: edit.createdAt || Date.now(),
    updatedAt: Date.now(),
    front: null, side: null
  };

    return makeThumb(s.img, s.photo).then(function(thumb){

    })
    .then(function(){ btns.forEach(function(b){ b.disabled = false; }); });
}

  var rec = findRec(detailId);
  if(!rec){ goList(); return; }

  $('dTitle').textContent = rec.name;

function recColumn(rec, isCurrent){
  var col = el('div','rec-col' + (isCurrent ? ' current' : ''));

  h.appendChild(el('span','tag'+(isCurrent?'':' alt'), isCurrent ? 'この記録' : '比較'));
  col.appendChild(h);

  var photos = el('div','photos');
  SLOT_KEYS.forEach(function(k){
    var box = el('div','photo-box');
    var head = el('h4');
    head.appendChild(el('span', null, SLOT_LABEL[k]));
    var p = rec[k];
    if(p) head.appendChild(el('span','tilt', linesText(p)));
    box.appendChild(head);
    var wrap = el('div','canvas-wrap');
    if(p){
      var cv = el('canvas');
      wrap.appendChild(cv);
      box.appendChild(wrap);
      var btn = el('button','btn sm', SHARE_OK ? '写真に保存・共有' : 'PNGで書き出し');
      btn.style.marginTop = '8px';
      btn.addEventListener('click', function(){ onExportClick(rec, k, btn); });
      box.appendChild(btn);
      // iPadの共有シートは「押した瞬間」にしか開けないため、PNGを先に用意しておく
      prepareExport(rec, k, btn);
      decodeBlob(p.blob).then(function(img){
        drawPhoto(cv, img, p, -1);
        addRenderTask(cv, img, p, -1);
      }).catch(function(){ wrap.appendChild(el('div','placeholder','画像を読めませんでした')); });
    } else {
      wrap.appendChild(el('div','placeholder','写真なし'));
      box.appendChild(wrap);
    }
    photos.appendChild(box);
  });
  col.appendChild(photos);
  return col;
}
// 共有シートにファイルを渡せる環境か（iPadOS/iOS Safari なら可）
var SHARE_OK = (function(){
  try{
    if(!navigator.share || !navigator.canShare) return false;
    return navigator.canShare({files:[new File([new Blob(['x'])], 'a.png', {type:'image/png'})]});

function pngName(rec, k){
  return safeName(rec.name)+'_'+String(rec.date).replace(/-/g,'')+'_'+SLOT_LABEL[k]+'.png';

// 線を焼き込んだ原寸PNGを作る
function renderPng(rec, k){
  var p = rec[k];
  return decodeBlob(p.blob).then(function(img){
    var c = document.createElement('canvas');
    c.width = p.w; c.height = p.h;
    var ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0, p.w, p.h);
    drawLines(ctx, p, 1, 1, -1);
    return toBlobP(c, 'image/png');
  });
}
// 詳細画面を開いた時点で裏で用意しておく
function prepareExport(rec, k, btn){
  renderPng(rec, k).then(function(blob){
    try { btn._file = new File([blob], pngName(rec,k), {type:'image/png'}); }
    catch(e){ btn._blob = blob; }
  }).catch(function(){});
}
function onExportClick(rec, k, btn){
  var f = btn._file;
  if(f && SHARE_OK){
    navigator.share({files:[f]}).catch(function(e){
      if(e && (e.name === 'AbortError')) return;      // ユーザーが閉じただけ
      download(f, f.name); toast('PNGを書き出しました');
    });
    return;
  }
  if(f || btn._blob){
    var b = f || btn._blob;
    download(b, pngName(rec,k)); toast('PNGを書き出しました');
    return;
  }
  exportPng(rec, k, btn);   // まだ用意できていない場合
}
function exportPng(rec, k, btn){
  if(!rec[k]) return;
  btn.disabled = true;
  renderPng(rec, k).then(function(blob){
    download(blob, pngName(rec,k));
    toast('PNGを書き出しました');
  }).catch(function(e){

  }).then(function(){ btn.disabled = false; });
}
function delDetail(){

/* =========================================================
   JSON 書き出し・読み込み
   ========================================================= */
function blobToDataURL(blob){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onload = function(){ res(fr.result); };
    fr.onerror = function(){ rej(fr.error); };
    fr.readAsDataURL(blob);
  });
}
function dataURLtoBlob(u){
  var i = u.indexOf(',');
  var head = u.slice(0, i), body = u.slice(i+1);
  var mime = (head.match(/:(.*?);/) || [,'application/octet-stream'])[1];
  var bin = atob(body);
  var arr = new Uint8Array(bin.length);
  for(var j=0;j<bin.length;j++) arr[j] = bin.charCodeAt(j);
  return new Blob([arr], {type:mime});
}
function exportJson(){
  var btn = $('btnExport');
  btn.disabled = true;
  toast('書き出しを準備中…');
  var out = {app:'posture-record', version:1, exportedAt:new Date().toISOString(), records:[]};
  var chain = Promise.resolve();
  records.forEach(function(r){
    chain = chain.then(function(){
      var o = {id:r.id, name:r.name, date:r.date, memo:r.memo||'',
               createdAt:r.createdAt||null, updatedAt:r.updatedAt||null};
      var jobs = SLOT_KEYS.map(function(k){
        if(!r[k]) { o[k] = null; return Promise.resolve(); }
        return blobToDataURL(r[k].blob).then(function(u){
          o[k] = {image:u, w:r[k].w, h:r[k].h, lines:linesOf(r[k])};
        });
      });
      return Promise.all(jobs).then(function(){ out.records.push(o); });
    });
  });
  chain.then(function(){
    var blob = new Blob([JSON.stringify(out)], {type:'application/json'});
    download(blob, '姿勢写真記録_backup_' + todayStr().replace(/-/g,'') + '.json');
    toast(out.records.length + '件を書き出しました');
  }).catch(function(e){
    alert('書き出せませんでした：' + (e && e.message ? e.message : e));
  }).then(function(){ btn.disabled = false; });
}
function importJson(file){
  var fr = new FileReader();
  fr.onload = function(){
    var data;
    try { data = JSON.parse(fr.result); }
    catch(e){ alert('JSONを読み取れませんでした。ファイルを確認してください。'); return; }
    if(!data || !Array.isArray(data.records)){
      alert('このアプリの書き出しファイルではないようです。'); return;
    }
    var n = data.records.length;
    var dup = data.records.filter(function(r){ return r.id && findRec(r.id); }).length;
    var msg = n + '件を読み込みます。\n';
    if(dup) msg += 'うち ' + dup + '件は同じIDの記録を上書きします。\n';
    msg += 'よろしいですか？';
    if(!confirm(msg)) return;

    toast('読み込み中…');
    var chain = Promise.resolve(), ok = 0, ng = 0;
    data.records.forEach(function(r){
      chain = chain.then(function(){
        var rec = {
          id: r.id || uid(),
          name: String(r.name || '無名'),
          date: /^\d{4}-\d{2}-\d{2}$/.test(r.date) ? r.date : todayStr(),
          memo: String(r.memo || ''),
          createdAt: r.createdAt || Date.now(),
          updatedAt: Date.now(),
          front: null, side: null
        };
        var jobs = SLOT_KEYS.map(function(k){
          var p = r[k];
          if(!p || !p.image) return Promise.resolve();
          var blob;
          try { blob = dataURLtoBlob(p.image); } catch(e){ return Promise.resolve(); }
          return decodeBlob(blob).then(function(img){
            var w = p.w || srcW(img), h = p.h || srcH(img);
            var lines = Array.isArray(p.lines) ? p.lines
                      : (p.line ? [p.line] : [defaultLine(w,h)]);   // 旧形式も受ける
            var photo = {blob:blob, w:w, h:h, lines:lines, thumb:null};
            return makeThumb(img, photo).then(function(t){
              rec[k] = {blob:blob, w:w, h:h, thumb:t, lines:lines};
            });
          }).catch(function(){});
        });
        return Promise.all(jobs)
          .then(function(){ return dbPut(rec); })
          .then(function(){ ok++; }, function(){ ng++; });
      });
    });
    chain.then(reload).then(function(){
      renderList();
      checkQuota();
      alert('読み込みが終わりました。\n成功 ' + ok + '件' + (ng ? ' / 失敗 ' + ng + '件' : ''));
    });
  };
  fr.onerror = function(){ alert('ファイルを読めませんでした。'); };
  fr.readAsText(file);
}

/* =========================================================
   容量チェック
   ========================================================= */
function checkQuota(){
  if(!navigator.storage || !navigator.storage.estimate) return;
  navigator.storage.estimate().then(function(est){
    var box = $('quotaNotice');
    if(!est || !est.quota){ box.classList.add('hidden'); return; }
    var ratio = est.usage / est.quota;
    var mb = function(v){ return (v/1048576).toFixed(0); };
    if(ratio >= 0.8){
      box.textContent = '保存容量が残り少なくなっています（使用 ' + mb(est.usage) + 'MB ／ 上限 ' +
        mb(est.quota) + 'MB・' + Math.round(ratio*100) + '%）。'+
        'JSONで書き出してバックアップを取り、古い記録を削除してください。';
      box.classList.remove('hidden');
    } else {
      box.classList.add('hidden');
    }
  }).catch(function(){});
}

/* =========================================================
   アプリ内カメラ（ガイド付き）
   ========================================================= */
var CAM_OK = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia &&
                location.protocol.indexOf('http') === 0);
var cam = {stream:null, key:null, facing:'environment', guide:'center'};
var GUIDE_LABEL = {center:'中央線', grid:'方眼', off:'なし'};

function openCam(k){
  if(!CAM_OK){ fallbackCamInput(k); return; }
  cam.key = k;
  var v = $('v-cam');
  v.classList.remove('hidden');
  v.setAttribute('aria-hidden','false');
  startCam();
}
function startCam(){
  stopStream();
  navigator.mediaDevices.getUserMedia({
    audio: false,
    video: { facingMode:{ideal:cam.facing}, width:{ideal:1920}, height:{ideal:1920} }
  }).then(function(s){
    cam.stream = s;
    var v = $('camVideo');
    v.srcObject = s;
    var p = v.play();
    if(p && p.catch) p.catch(function(){});
    v.onloadedmetadata = layoutGuide;
    setTimeout(layoutGuide, 300);
  }).catch(function(e){
    var k = cam.key;
    closeCam();
    var name = e && e.name ? e.name : '';
    if(name === 'NotAllowedError'){
      alert('カメラの使用が許可されていません。\n端末の設定でカメラを許可するか、「画像を選択」から取り込んでください。');
    } else {
      alert('カメラを起動できませんでした（'+name+'）。端末標準のカメラを使います。');
      fallbackCamInput(k);
    }
  });
}
function stopStream(){
  if(cam.stream){
    cam.stream.getTracks().forEach(function(t){ try{ t.stop(); }catch(e){} });
    cam.stream = null;
  }
  var v = $('camVideo');
  if(v){ try{ v.srcObject = null; }catch(e){} }
}
function closeCam(){
  stopStream();
  var v = $('v-cam');
  v.classList.add('hidden');
  v.setAttribute('aria-hidden','true');
}
function fallbackCamInput(k){
  var slot = $('slots').querySelector('.slot[data-k="'+k+'"]');
  if(slot) slot.querySelector('[data-el="cam"]').click();
}
// ガイドを映像の表示範囲にぴったり重ねる
function layoutGuide(){
  var v = $('camVideo'), st = $('camStage'), ov = $('camOverlay');
  if(!v || !v.videoWidth || !st) return;
  var sw = st.clientWidth, sh = st.clientHeight;
  var sc = Math.min(sw/v.videoWidth, sh/v.videoHeight);
  var w = v.videoWidth*sc, h = v.videoHeight*sc;
  ov.style.width = w+'px';  ov.style.height = h+'px';
  ov.style.left = ((sw-w)/2)+'px'; ov.style.top = ((sh-h)/2)+'px';
  ov.innerHTML = guideSVG(cam.guide);
}
function guideSVG(mode){
  if(mode === 'off') return '';
  var thin = 'stroke="#ffffff" stroke-opacity="0.85" stroke-width="1" vector-effect="non-scaling-stroke" stroke-dasharray="6 5"';
  var s = '<svg viewBox="0 0 100 100" preserveAspectRatio="none">';
  if(mode === 'grid'){
    [100/3, 200/3].forEach(function(p){
      s += '<line x1="'+p+'" y1="0" x2="'+p+'" y2="100" '+thin+'/>';
      s += '<line x1="0" y1="'+p+'" x2="100" y2="'+p+'" '+thin+'/>';
    });
  } else {
    [25,50,75].forEach(function(p){
      s += '<line x1="0" y1="'+p+'" x2="100" y2="'+p+'" '+thin+'/>';
    });
  }
  s += '<line x1="50" y1="0" x2="50" y2="100" stroke="#ff2a2a" stroke-width="2" vector-effect="non-scaling-stroke"/>';
  s += '<rect x="0" y="0" width="100" height="100" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2" vector-effect="non-scaling-stroke"/>';
  return s + '</svg>';
}
function shoot(){
  var v = $('camVideo');
  // 映像が小さすぎる＝まだ準備できていない／途切れた。壊れた写真を保存しない
  if(!v || v.videoWidth < 240 || v.videoHeight < 240){
    toast('カメラの準備中です。少し待ってからもう一度押してください');
    return;
  }
  var c = document.createElement('canvas');
  c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);   // ガイドは写し込まない
  var k = cam.key;
  toBlobP(c, 'image/jpeg', 0.92).then(function(blob){
    closeCam();
    return applyPhoto(k, blob);
  }).catch(function(e){
    closeCam();
    alert('撮影できませんでした：' + (e && e.message ? e.message : e));
  });
}

/* =========================================================
   印刷
   ========================================================= */
var printURLs = [];
function printTargets(){
  var rec = findRec(detailId);
  if(!rec) return [];
  var cmp = compareId ? findRec(compareId) : null;
  return cmp ? [cmp, rec] : [rec];
}
function openPrintPanel(){
  var recs = printTargets();
  if(!recs.length) return;
  $('ppSub').textContent = recs.length > 1
    ? '比較中のため、' + fmtDate(recs[0].date) + ' と ' + fmtDate(recs[1].date) + ' の2時点を並べて印刷します。'
    : fmtDate(recs[0].date) + ' の正面・側面を印刷します。';
  var p = $('printPanel');
  p.hidden = !p.hidden;
}
function clearPrintArea(){
  $('printArea').textContent = '';
  printURLs.forEach(function(u){ URL.revokeObjectURL(u); });
  printURLs = [];
}
function imgFor(rec, k){
  return renderPng(rec, k).then(function(blob){
    return new Promise(function(res, rej){
      var u = URL.createObjectURL(blob);
      printURLs.push(u);
      var img = new Image();
      img.onload = function(){ res(img); };
      img.onerror = function(){ rej(new Error('画像を準備できませんでした')); };
      img.src = u;
    });
  });
}
function printCell(rec, k, img, withDate){
  var d = el('div','p-cell');
  d.appendChild(img);
  var cap = el('div','p-cap');
  cap.appendChild(el('b', null, SLOT_LABEL[k]));
  cap.appendChild(el('span', null, '　' + linesText(rec[k])));
  if(withDate){ cap.appendChild(el('br')); cap.appendChild(el('span', null, fmtDate(rec.date))); }
  d.appendChild(cap);
  return d;
}
function doPrint(layout){
  var recs = printTargets();
  if(!recs.length) return;
  var multi = recs.length > 1;
  var cur = recs[recs.length-1];
  clearPrintArea();
  $('printPanel').hidden = true;
  toast('印刷の準備中…');

  var jobs = [];
  recs.forEach(function(r){
    SLOT_KEYS.forEach(function(k){
      jobs.push(r[k] ? imgFor(r, k).then(function(img){ return {r:r, k:k, img:img}; })
                     : Promise.resolve(null));
    });
  });
  Promise.all(jobs).then(function(items){
    var got = {};
    items.forEach(function(it){ if(it) got[it.r.id+'|'+it.k] = it.img; });
    var area = $('printArea');
    var sub = '撮影日 ' + (multi ? recs.map(function(r){ return fmtDate(r.date); }).join(' → ')
                                 : fmtDate(cur.date));
    function head(extra){
      var h = el('div','p-head');
      h.appendChild(el('div','p-name', cur.name + ' 様'));
      h.appendChild(el('div','p-sub', extra ? sub + '／' + extra : sub));
      return h;
    }
    function foot(){ return el('div','p-foot', '印刷日 ' + fmtDate(todayStr()) + '　姿勢写真記録'); }
    function rowFor(k, cls){
      var row = el('div','p-row '+cls), n = 0;
      recs.forEach(function(r){
        var img = got[r.id+'|'+k];
        if(!img) return;
        n++;
        row.appendChild(printCell(r, k, img, multi));
      });
      return n ? row : null;
    }

    if(layout === 'duplex'){
      SLOT_KEYS.forEach(function(k){
        var row = rowFor(k, multi ? 'p-img-lg' : 'p-img-xl');
        if(!row) return;
        var page = el('div','p-page');
        page.appendChild(head(SLOT_LABEL[k]));
        page.appendChild(row);
        if(k === 'side' && cur.memo && cur.memo.trim()) page.appendChild(el('div','p-memo', cur.memo));
        page.appendChild(foot());
        area.appendChild(page);
      });
    } else {
      var page = el('div','p-page');
      page.appendChild(head(''));
      if(multi){
        SLOT_KEYS.forEach(function(k){
          var row = rowFor(k, 'p-img-sm');
          if(row) page.appendChild(row);
        });
      } else {
        var row = el('div','p-row p-img-md');
        SLOT_KEYS.forEach(function(k){
          var img = got[cur.id+'|'+k];
          if(img) row.appendChild(printCell(cur, k, img, false));
        });
        page.appendChild(row);
      }
      if(cur.memo && cur.memo.trim()) page.appendChild(el('div','p-memo', cur.memo));
      page.appendChild(foot());
      area.appendChild(page);
    }
    if(!area.childNodes.length){ alert('印刷できる写真がありません。'); return; }
    setTimeout(function(){ window.print(); }, 150);
  }).catch(function(e){
    alert('印刷の準備に失敗しました：' + (e && e.message ? e.message : e));
  });
}
window.addEventListener('afterprint', clearPrintArea);

/* =========================================================
   起動
   ========================================================= */
function reload(){
  return dbAll().then(function(all){
    records = all || [];
    return records;
  });
}
function goList(){
  renderTasks = [];
  renderList();
  showView('list');
}

$('btnNew').addEventListener('click', function(){ openEdit(null); });
$('q').addEventListener('input', renderList);
$('eBack').addEventListener('click', function(){
  if(confirm('編集中の内容を破棄して戻りますか？')) goList();
});
$('eSave').addEventListener('click', saveEdit);
$('eSave2').addEventListener('click', saveEdit);
$('dBack').addEventListener('click', goList);
$('dEdit').addEventListener('click', function(){
  var rec = findRec(detailId);
  if(rec) openEdit(rec);
});
$('dDel').addEventListener('click', delDetail);
$('dPrint').addEventListener('click', openPrintPanel);
$('printPanel').addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('button') : null;
  if(!b) return;
  if(b.dataset.act === 'close'){ $('printPanel').hidden = true; return; }
  if(b.dataset.layout) doPrint(b.dataset.layout);
});
$('camCancel').addEventListener('click', closeCam);
$('camShot').addEventListener('click', shoot);
$('camSwitch').addEventListener('click', function(){
  cam.facing = (cam.facing === 'environment') ? 'user' : 'environment';
  startCam();
});
$('camGuide').addEventListener('click', function(){
  cam.guide = cam.guide === 'center' ? 'grid' : (cam.guide === 'grid' ? 'off' : 'center');
  $('camGuide').textContent = 'ガイド：' + GUIDE_LABEL[cam.guide];
  layoutGuide();
});
window.addEventListener('resize', layoutGuide);
window.addEventListener('orientationchange', function(){ setTimeout(layoutGuide, 350); });
document.addEventListener('visibilitychange', function(){
  if(document.hidden && cam.stream) closeCam();   // 裏に回ったらカメラを止める
});
$('dCmp').addEventListener('change', function(e){
  compareId = e.target.value;
  $('printPanel').hidden = true;
  renderDetail();
});
$('btnExport').addEventListener('click', exportJson);
$('btnImport').addEventListener('click', function(){ $('impFile').click(); });
$('impFile').addEventListener('change', function(e){
  var f = e.target.files && e.target.files[0];
  e.target.value = '';
  if(f) importJson(f);
});

// オフライン動作（サーバーに置いた場合のみ。file:// では何もしない）
if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      reg.addEventListener('updatefound', function(){
        var sw = reg.installing;
        if(!sw) return;
        sw.addEventListener('statechange', function(){
          if(sw.state === 'installed' && navigator.serviceWorker.controller){
            toast('新しいバージョンがあります。再読み込みしてください');
          }
        });
      });
    }).catch(function(){});
  });
}

reload().then(function(){
  renderList();
  checkQuota();
}).catch(function(e){
  dbBroken = true;
  var box = $('dbNotice');
  box.innerHTML = 'データベースを利用できないため、保存ができません。<br>' +
    'ファイルを直接開いた（file://）場合、Chrome ではブラウザの制限で保存できません。' +
    'Safari で開くか、Web サーバー上（社内・Netlify 等）に置いて開いてください。<br>' +
    '<small>詳細: ' + (e && e.message ? e.message : e) + '</small>';
  box.classList.remove('hidden');
  renderList();
});
</script>
